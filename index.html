<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mermaid Cove</title>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; background: #161817; color: #a5d8d1; }
      main { max-width: 1200px; margin: 0 auto; padding: 32px; }
      textarea { width: 100%; min-height: 180px; box-sizing: border-box; color: #cbe9e3; background: #101312; border: 1px solid #31514d; border-radius: 12px; padding: 14px; font: 14px ui-monospace, monospace; }
      button { margin: 12px 0; border: 1px solid #4d9e95; background: #142b28; color: #a5d8d1; border-radius: 999px; padding: 9px 16px; cursor: pointer; }
      body[data-theme="light"] { color-scheme:light; background:#fff; color:#285e57; }
      #diagram { min-height: 300px; display: flex; align-items: center; justify-content: center; overflow: auto; }
      #diagram svg { width: 100%; height: auto; max-height: 70vh; }
    </style>
  </head>
  <body>
    <main>
      <textarea id="source" aria-label="Mermaid source"></textarea>
      <label>Theme <select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select></label>
      <button id="render" type="button">Render</button>
      <section id="diagram" aria-label="Mermaid diagram"></section>
    </main>
    <script type="module" src="/src/demo.js"></script>
  </body>
</html>
